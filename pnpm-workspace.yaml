packages:
  - "apps/*"
  - "packages/*"

# Allow these packages to run their install scripts (native builds / engines).
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - "@tailwindcss/oxide"
  - argon2
  - esbuild
  - msgpackr-extract
  - "@scarf/scarf"

# These latest-stable releases are newer than the default supply-chain
# cooldown; we explicitly opt in to them (see rule: use latest stable).
minimumReleaseAgeExclude:
  - "@nestjs/cli@12.0.11"
  - "@nestjs/common@12.3.1"
  - "@nestjs/core@12.3.1"
  - "@nestjs/platform-express@12.3.1"
  - "@nestjs/swagger@12.0.5"
  - "bullmq@6.5.0"
  - "@nestjs/schematics@12.0.0"
  - "@nestjs/config@12.0.1"
  - "@nestjs/jwt@12.0.3"
  - "@nestjs/passport@12.0.0"
  - "@nestjs/schedule@12.0.2"
  - "@nestjs/terminus@12.1.0"
  - "@nestjs/bullmq@12.0.0"
  - "@nestjs/mapped-types@12.0.0"
  - lucide-react@1.62.0

# Avoid the pre-run install nag in this multi-package workspace.
verifyDepsBeforeRun: false
